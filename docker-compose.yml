services:
  neo4j:
    image: neo4j:latest
    container_name: rag_neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/my_neo4j_password  # Match the password in your .env
      - NEO4J_PLUGINS=["apoc"]  # APOC is often useful for graph algos
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./neo4j_import:/var/lib/neo4j/import
      - ./neo4j_plugins:/plugins
    restart: unless-stopped

networks:
  default:
    name: rag_network
